<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Chat4Now Messenger</title>
  <!-- Jitsi Meet External API -->
  <script src="https://meet.jit.si/external_api.js"></script>
  <style>
    :root {
      --bg-primary: #0f172a;
      --bg-secondary: #1e293b;
      --bg-card: #1e293b;
      --bg-hover: #334155;
      --accent: #10b981;
      --accent-gradient: linear-gradient(135deg, #10b981 0%, #059669 100%);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border-color: rgba(255, 255, 255, 0.08);
      --danger: #ef4444;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; -webkit-tap-highlight-color: transparent; }
    
    html, body { 
      height: 100dvh; 
      width: 100vw; 
      overflow: hidden; 
      background-color: var(--bg-primary); 
      color: var(--text-main); 
    }

    body { display: flex; justify-content: center; align-items: center; }

    .app-container { 
      width: 100vw; 
      height: 100dvh; 
      max-width: 1200px; 
      max-height: 100dvh; 
      display: flex; 
      background: var(--bg-secondary); 
      position: relative; 
      overflow: hidden; 
    }

    @media (min-width: 768px) { 
      .app-container { 
        height: 92dvh; 
        max-height: 880px; 
        border-radius: 20px; 
        box-shadow: 0 20px 40px rgba(0,0,0,0.6); 
        border: 1px solid var(--border-color);
      } 
    }

    /* Modern Toast Notification replacing default alert */
    #toast-notification {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%) translateY(-100px);
      background: #334155;
      color: #fff;
      padding: 12px 24px;
      border-radius: 30px;
      font-size: 14px;
      font-weight: 500;
      box-shadow: 0 10px 25px rgba(0,0,0,0.4);
      z-index: 99999;
      transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      border: 1px solid rgba(255,255,255,0.1);
      display: flex;
      align-items: center;
      gap: 10px;
    }
    #toast-notification.show { transform: translateX(-50%) translateY(0); }

    /* Login Screen - Modern & Sleek */
    .login-overlay {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: radial-gradient(circle at center, #1e293b 0%, #0f172a 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }

    .login-card { 
      background: rgba(30, 41, 59, 0.7); 
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      padding: 40px 30px; 
      border-radius: 24px; 
      width: 90%; 
      max-width: 400px; 
      text-align: center; 
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5); 
      border: 1px solid var(--border-color);
    }
    .login-logo {
      width: 70px; height: 70px;
      background: var(--accent-gradient);
      border-radius: 20px;
      margin: 0 auto 20px auto;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      box-shadow: 0 10px 20px rgba(16, 185, 129, 0.3);
    }
    .login-card h1 { color: #fff; font-size: 26px; font-weight: 700; margin-bottom: 6px; }
    .login-card p { color: var(--text-muted); font-size: 14px; margin-bottom: 24px; }
    .login-card input { width: 100%; padding: 14px 18px; border-radius: 12px; border: 1px solid var(--border-color); background: rgba(15, 23, 42, 0.6); color: #fff; margin-bottom: 14px; font-size: 15px; outline: none; transition: all 0.3s; }
    .login-card input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.15); }
    .btn-login { width: 100%; padding: 14px; border-radius: 12px; border: none; background: var(--accent-gradient); color: #0f172a; font-weight: 700; font-size: 16px; cursor: pointer; margin-bottom: 12px; transition: transform 0.2s, opacity 0.2s; box-shadow: 0 4px 12px rgba(16,185,129,0.2); }
    .btn-login:active { transform: scale(0.98); }
    .btn-guest { width: 100%; padding: 14px; border-radius: 12px; border: 1px solid var(--border-color); background: transparent; color: var(--text-main); font-weight: 600; font-size: 14px; cursor: pointer; transition: background 0.2s; }
    .btn-guest:hover { background: rgba(255,255,255,0.05); }

    #main-app { display: none; width: 100%; height: 100dvh; flex-direction: row; }

    /* Sidebar */
    .sidebar { 
      width: 100%; 
      max-width: 380px; 
      background: var(--bg-secondary); 
      border-right: 1px solid var(--border-color); 
      display: flex; 
      flex-direction: column; 
      height: 100%; 
      z-index: 10;
      position: relative;
    }

    @media (max-width: 768px) { 
      .sidebar { max-width: 100%; } 
      .chat-area { display: none; } 
      .chat-area.active { display: flex !important; position: absolute; top: 0; left: 0; width: 100vw; height: 100dvh; z-index: 30; } 
    }

    .sidebar-header { background: rgba(30, 41, 59, 0.9); backdrop-filter: blur(10px); padding: 16px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border-color); flex-shrink: 0; }
    .user-info { display: flex; align-items: center; gap: 12px; }
    .avatar-icon { width: 44px; height: 44px; border-radius: 50%; background: var(--accent-gradient); color: #0f172a; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 18px; flex-shrink: 0; box-shadow: 0 4px 10px rgba(16,185,129,0.2); }
    .ping-badge { font-size: 11px; background: rgba(15, 23, 42, 0.6); padding: 4px 10px; border-radius: 20px; color: var(--accent); border: 1px solid var(--border-color); font-weight: 500; }

    /* Modern Telegram/WhatsApp Tab Bar */
    .tab-bar { display: flex; background: rgba(15, 23, 42, 0.4); padding: 6px; margin: 12px 12px 4px 12px; border-radius: 12px; border: 1px solid var(--border-color); flex-shrink: 0; }
    .tab-btn { flex: 1; padding: 10px 0; background: none; border: none; color: var(--text-muted); font-weight: 600; font-size: 12px; cursor: pointer; border-radius: 8px; transition: all 0.2s ease; text-align: center; }
    .tab-btn.active { color: #fff; background: rgba(255, 255, 255, 0.08); box-shadow: 0 2px 5px rgba(0,0,0,0.2); }

    .list-container { flex: 1; overflow-y: auto; padding: 8px 12px; position: relative; }
    .list-container::-webkit-scrollbar { width: 4px; }
    .list-container::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 4px; }

    .search-box { padding: 8px 12px 4px 12px; background: transparent; flex-shrink: 0; display: none; }
    .search-box input { width: 100%; padding: 12px 16px; border-radius: 12px; border: 1px solid var(--border-color); background: rgba(15, 23, 42, 0.5); color: #fff; font-size: 14px; outline: none; transition: all 0.3s; }
    .search-box input:focus { border-color: var(--accent); background: rgba(15, 23, 42, 0.8); }

    .list-item { display: flex; align-items: center; justify-content: space-between; padding: 10px 12px; border-radius: 12px; margin-bottom: 6px; background: transparent; cursor: pointer; transition: background 0.2s; border: 1px solid transparent; }
    .list-item:hover { background: var(--bg-hover); border-color: var(--border-color); }
    .list-item-left { display: flex; align-items: center; gap: 12px; flex: 1; min-width: 0; }

    .btn-action { padding: 8px 16px; border-radius: 8px; border: none; font-size: 12px; font-weight: 700; cursor: pointer; transition: transform 0.1s; }
    .btn-action:active { transform: scale(0.95); }
    .btn-add { background: var(--accent); color: #0f172a; }
    .btn-accept { background: #10b981; color: #fff; }
    .btn-unfriend { background: rgba(239, 68, 68, 0.15); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.3); }
    .btn-unfriend:hover { background: var(--danger); color: #fff; }

    /* Floating Action Button (+) */
    #fab-find {
      position: absolute;
      bottom: 24px;
      right: 24px;
      width: 58px;
      height: 58px;
      background: var(--accent-gradient);
      border-radius: 50%;
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #0f172a;
      font-size: 28px;
      font-weight: bold;
      box-shadow: 0 8px 20px rgba(16, 185, 129, 0.4);
      cursor: pointer;
      z-index: 20;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    #fab-find:hover { transform: scale(1.05); box-shadow: 0 12px 25px rgba(16, 185, 129, 0.6); }
    #fab-find:active { transform: scale(0.95); }

    /* Chat Area */
    .chat-area { flex: 1; display: flex; flex-direction: column; background: var(--bg-primary); height: 100%; width: 100%; position: relative; overflow: hidden; }

    .chat-header { background: rgba(30, 41, 59, 0.85); backdrop-filter: blur(10px); padding: 12px 20px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--border-color); flex-shrink: 0; height: 68px; }

    .back-btn { display: none; background: none; border: none; color: var(--accent); font-size: 22px; cursor: pointer; margin-right: 12px; }
    @media (max-width: 768px) { .back-btn { display: block; } }

    .messages-box { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 12px; background: radial-gradient(circle at center, rgba(30,41,59,0.2) 0%, transparent 100%); }

    .message-bubble { max-width: 75%; padding: 10px 14px; border-radius: 14px; font-size: 14px; line-height: 1.5; word-wrap: break-word; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
    .msg-incoming { background: var(--bg-secondary); align-self: flex-start; color: var(--text-main); border-bottom-left-radius: 4px; border: 1px solid var(--border-color); }
    .msg-outgoing { background: #059669; align-self: flex-end; color: #fff; border-bottom-right-radius: 4px; }
    .msg-sender { font-size: 11px; font-weight: 700; color: #34d399; margin-bottom: 3px; }

    .chat-footer { background: rgba(30, 41, 59, 0.85); backdrop-filter: blur(10px); padding: 12px 16px; display: flex; flex-direction: column; gap: 8px; border-top: 1px solid var(--border-color); flex-shrink: 0; width: 100%; }

    .controls-bar { display: flex; justify-content: space-between; align-items: center; font-size: 12px; color: var(--text-muted); }
    .input-row { display: flex; align-items: center; gap: 10px; width: 100%; }
    .input-row input[type="text"] { flex: 1; padding: 12px 16px; border-radius: 12px; border: 1px solid var(--border-color); background: rgba(15, 23, 42, 0.6); color: #fff; font-size: 14px; outline: none; transition: border-color 0.3s; }
    .input-row input[type="text"]:focus { border-color: var(--accent); }
    .btn-send { padding: 12px 20px; border-radius: 12px; border: none; background: var(--accent-gradient); color: #0f172a; font-weight: 700; cursor: pointer; flex-shrink: 0; transition: opacity 0.2s; box-shadow: 0 4px 10px rgba(16,185,129,0.2); }
    .icon-btn { background: none; border: none; color: var(--text-muted); font-size: 20px; cursor: pointer; flex-shrink: 0; transition: color 0.2s; }
    .icon-btn:hover { color: var(--accent); }

    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.15); }
      100% { transform: scale(1); }
    }

    /* Floating Chat Head */
    #chat-head {
      position: fixed;
      bottom: 24px;
      right: 24px;
      width: 58px;
      height: 58px;
      background: var(--accent-gradient);
      border-radius: 50%;
      display: none;
      align-items: center;
      justify-content: center;
      color: #0f172a;
      font-weight: bold;
      font-size: 22px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.5);
      cursor: pointer;
      z-index: 999;
      user-select: none;
      touch-action: none;
    }
    #chat-head-badge {
      position: absolute;
      top: -2px;
      right: -2px;
      background: var(--danger);
      color: white;
      border-radius: 50%;
      padding: 2px 7px;
      font-size: 11px;
      font-weight: 700;
      display: none;
    }

    /* Incoming Call Modal Alert */
    #incoming-call-modal {
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100dvh;
      background: rgba(15, 23, 42, 0.95);
      backdrop-filter: blur(15px);
      z-index: 10000;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 24px;
      text-align: center;
    }
    .caller-avatar {
      width: 100px; height: 100px;
      border-radius: 50%;
      background: var(--accent-gradient);
      color: #0f172a;
      font-size: 40px;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 30px rgba(16, 185, 129, 0.4);
      animation: pulse 1.5s infinite;
    }
    .call-actions { display: flex; gap: 40px; margin-top: 20px; }
    .btn-call-action {
      width: 70px; height: 70px;
      border-radius: 50%;
      border: none;
      font-size: 26px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 8px 20px rgba(0,0,0,0.3);
      transition: transform 0.2s;
    }
    .btn-call-action:active { transform: scale(0.92); }
    .btn-accept-call { background: #10b981; color: white; }
    .btn-decline-call { background: var(--danger); color: white; }

    #call-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: var(--bg-primary); z-index: 100; display: none; flex-direction: column; }
    #jitsi-container { width: 100%; height: calc(100% - 56px); }
  </style>
</head>
<body>

  <!-- Modern Toast Notification -->
  <div id="toast-notification">Notification text</div>

  <!-- Floating Messenger Chat Head -->
  <div id="chat-head" title="Open Active Chat">
    <span id="chat-head-initial">💬</span>
    <div id="chat-head-badge">0</div>
  </div>

  <!-- Incoming Call Modal -->
  <div id="incoming-call-modal">
    <div class="caller-avatar" id="incoming-caller-initial">?</div>
    <div>
      <h2 id="incoming-caller-name" style="font-size: 26px; font-weight: 700; margin-bottom: 8px;">Incoming Call</h2>
      <p style="color: var(--text-muted); font-size: 15px;" id="incoming-call-type">Incoming video call...</p>
    </div>
    <div class="call-actions">
      <button class="btn-call-action btn-decline-call" id="decline-call-btn" title="Decline">✕</button>
      <button class="btn-call-action btn-accept-call" id="accept-call-btn" title="Accept">📞</button>
    </div>
  </div>

  <!-- Login Screen -->
  <div class="login-overlay" id="login-screen">
    <div class="login-card">
      <div class="login-logo">💬</div>
      <h1>Chat4Now</h1>
      <p>Modern secure messaging system</p>
      <input type="text" id="username-input" placeholder="Enter your display name..." />
      <button class="btn-login" id="enter-btn">Start Messaging</button>
      <button class="btn-guest" id="guest-btn">👤 Continue as Guest</button>
    </div>
  </div>

  <!-- Main Messenger Layout -->
  <div class="app-container" id="main-app">
    
    <!-- Sidebar -->
    <div class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <div class="user-info">
          <div class="avatar-icon" id="user-avatar">U</div>
          <div>
            <strong id="my-name-display" style="font-size: 15px; font-weight: 600;">User</strong>
            <div style="font-size: 11px; color: var(--accent); font-weight: 500;">● Online</div>
          </div>
        </div>
        <div class="ping-badge" id="ping-display">Ping: -- ms</div>
      </div>

      <!-- Tab bar -->
      <div class="tab-bar">
        <button class="tab-btn active" id="tab-chats">CHATS</button>
        <button class="tab-btn" id="tab-requests">REQUESTS <span id="req-count"></span></button>
        <button class="tab-btn" id="tab-friends">FRIENDS</button>
      </div>

      <!-- Search box for FIND view -->
      <div class="search-box" id="search-box-container">
        <input type="text" id="search-users-input" placeholder="🔍 Search users to add..." />
      </div>

      <div class="list-container">
        <div id="chats-list"></div>
        <div id="requests-list" style="display: none;"></div>
        <div id="friends-list" style="display: none;"></div>
        <div id="search-results-list" style="display: none;"></div>
      </div>

      <!-- Floating Action Button (+) for Find/Search view -->
      <button id="fab-find" title="Find & Add Friends">+</button>
    </div>

    <!-- Main Chat Window -->
    <div class="chat-area" id="chat-area">
      <div id="no-chat-selected" style="flex: 1; display: flex; justify-content: center; align-items: center; color: var(--text-muted); flex-direction: column; gap: 14px;">
        <div style="font-size: 48px; opacity: 0.5;">💬</div>
        <div style="font-size: 15px; font-weight: 500;">Select a friend from your friends list to start chatting</div>
      </div>

      <div id="active-chat-window" style="display: none; flex-direction: column; height: 100%; width: 100%;">
        <div class="chat-header">
          <div style="display: flex; align-items: center;">
            <button class="back-btn" id="back-to-list">←</button>
            <div style="display: flex; align-items: center; gap: 12px;">
              <div class="avatar-icon" id="active-friend-avatar" style="width: 38px; height: 38px; font-size: 15px;">?</div>
              <div>
                <strong id="active-friend-name" style="font-size: 15px; font-weight: 600;">Friend Name</strong>
                <div style="font-size: 11px; color: var(--text-muted);" id="active-friend-status">Offline</div>
              </div>
            </div>
          </div>
          <div style="display: flex; gap: 16px;">
            <button class="icon-btn" id="start-voice-call-btn" title="Start Voice Call">📞</button>
            <button class="icon-btn" id="start-video-call-btn" title="Start Video Call">📹</button>
          </div>
        </div>

        <div class="messages-box" id="messages-box"></div>

        <div class="chat-footer">
          <div class="controls-bar">
            <label style="display: flex; align-items: center; gap: 6px; cursor: pointer;">
              <input type="checkbox" id="hd-toggle" style="accent-color: var(--accent);" />
              <span><b>HD File Mode</b> (Up to 1GB Storage)</span>
            </label>
            <span id="selected-file-name" style="color: var(--accent); font-size: 11px; max-width: 150px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;"></span>
          </div>

          <div class="input-row">
            <label class="icon-btn" for="file-upload-input" title="Attach File">📎</label>
            <input type="file" id="file-upload-input" style="display: none;" accept="image/*,video/*,.pdf,.zip,.doc" />
            
            <button class="icon-btn" id="record-audio-btn" title="Record Voice Note">🎙️</button>
            
            <input type="text" id="message-text-input" placeholder="Type a message..." />
            <button class="btn-send" id="send-msg-btn">Send</button>
          </div>
        </div>
      </div>

      <!-- Native Jitsi Call Overlay -->
      <div id="call-overlay">
        <div style="padding: 12px 20px; background: rgba(30, 41, 59, 0.9); display: flex; justify-content: space-between; align-items: center; height: 56px;">
          <span id="call-type-title" style="font-weight: 600;">Call</span>
          <button class="btn-action" style="background: var(--danger); color: #fff;" id="end-call-btn">End Call</button>
        </div>
        <div id="jitsi-container"></div>
      </div>

    </div>

  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, addDoc, query, orderBy, onSnapshot, serverTimestamp, setDoc, doc, deleteDoc, updateDoc, arrayRemove, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
    import { getStorage, ref, uploadBytesResumable, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-storage.js";

    const firebaseConfig = {
      apiKey: "AIzaSyC3mJ-9-hv85jZiAsGi_kuuZjj_mmjAUmQ",
      authDomain: "chat4now-orforever.firebaseapp.com",
      projectId: "chat4now-orforever",
      storageBucket: "chat4now-orforever.firebasestorage.app",
      messagingSenderId: "1027816238177",
      appId: "1:1027816238177:web:9b3794c53f4d194cbc4e20"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const storage = getStorage(app);

    let myName = "";
    let activeFriend = null;
    let myFriendsList = [];

    const loginScreen = document.getElementById('login-screen');
    const mainApp = document.getElementById('main-app');
    const usernameInput = document.getElementById('username-input');
    const enterBtn = document.getElementById('enter-btn');
    const guestBtn = document.getElementById('guest-btn');
    
    const chatsListDiv = document.getElementById('chats-list');
    const requestsListDiv = document.getElementById('requests-list');
    const friendsListDiv = document.getElementById('friends-list');
    const searchResultsDiv = document.getElementById('search-results-list');
    const searchBoxContainer = document.getElementById('search-box-container');
    const fabFind = document.getElementById('fab-find');
    const searchUsersInput = document.getElementById('search-users-input');
    const toastNotification = document.getElementById('toast-notification');

    function showToast(message) {
      toastNotification.textContent = message;
      toastNotification.classList.add('show');
      setTimeout(() => {
        toastNotification.classList.remove('show');
      }, 3000);
    }
    
    async function handleLogin(name) {
      if (!name) return showToast("Please enter a valid name or continue as Guest!");
      myName = name;

      document.getElementById('my-name-display').textContent = myName;
      document.getElementById('user-avatar').textContent = myName.charAt(0).toUpperCase();

      if ("Notification" in window && Notification.permission !== "granted") {
        Notification.requestPermission();
      }

      await setUserOnline();

      loginScreen.style.display = "none";
      mainApp.style.display = "flex";

      startPingMeasurement();
      listenMyUserData();
      listenAllUsersStatus();
      listenMyFriends();
      listenIncomingCalls();
      keepOnlineHeartbeat();
    }

    enterBtn.addEventListener('click', () => {
      handleLogin(usernameInput.value.trim());
    });

    guestBtn.addEventListener('click', () => {
      const guestName = "Guest_" + Math.floor(1000 + Math.random() * 9000);
      handleLogin(guestName);
    });

    async function setUserOnline() {
      if (!myName) return;
      await setDoc(doc(db, "users", myName), { name: myName, status: "online", lastSeen: Date.now() }, { merge: true });
    }

    function keepOnlineHeartbeat() {
      setInterval(async () => {
        if (myName) {
          await setDoc(doc(db, "users", myName), { status: "online", lastSeen: Date.now() }, { merge: true });
        }
      }, 10000);
    }

    // Load All Users for FIND (+) section
    function loadFindUsers(filterKeyword = "") {
      const usersQuery = query(collection(db, "users"));
      
      onSnapshot(usersQuery, (snapshot) => {
        searchResultsDiv.innerHTML = "";
        let usersFound = false;

        snapshot.forEach((docSnap) => {
          const userData = docSnap.data();
          const targetName = userData.name;

          if (targetName === myName) return;
          if (targetName && targetName.startsWith("Guest_")) return; // Hide guests
          
          if (filterKeyword && !targetName.toLowerCase().includes(filterKeyword.toLowerCase())) {
            return;
          }

          usersFound = true;
          const isOnline = userData.status === "online" && (Date.now() - (userData.lastSeen || 0) < 15000);
          
          const item = document.createElement('div');
          item.className = 'list-item';
          item.innerHTML = `
            <div class="list-item-left">
              <div class="avatar-icon" style="width: 38px; height: 38px; font-size: 15px;">${targetName.charAt(0).toUpperCase()}</div>
              <div style="min-width: 0;">
                <strong style="font-size: 14px; display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">${targetName}</strong>
                <div style="font-size: 11px; color: ${isOnline ? '#34d399' : 'var(--text-muted)'};">
                  ${isOnline ? '● Online' : '○ Offline'}
                </div>
              </div>
            </div>
            <button class="btn-action btn-add">Add</button>
          `;

          const addBtn = item.querySelector('.btn-add');
          addBtn.addEventListener('click', async () => {
            await sendFriendRequest(targetName);
          });

          searchResultsDiv.appendChild(item);
        });

        if (!usersFound) {
          searchResultsDiv.innerHTML = `<div style="text-align: center; color: var(--text-muted); padding: 30px; font-size: 13px;">No users found.</div>`;
        }
      });
    }

    searchUsersInput.addEventListener('input', (e) => {
      loadFindUsers(e.target.value.trim());
    });

    async function sendFriendRequest(targetUser) {
      if (!myName || !targetUser) return;
      try {
        await setDoc(doc(db, "requests", `${targetUser}_${myName}`), {
          from: myName,
          to: targetUser,
          status: "pending",
          timestamp: serverTimestamp()
        });
        showToast(`Friend request sent to ${targetUser}!`);
      } catch (err) {
        console.error("Error sending request:", err);
      }
    }

    // Load only True Friends for Friends Tab with Unfriend option
    function listenMyFriends() {
      const userDocRef = doc(db, "users", myName);
      
      onSnapshot(userDocRef, (docSnap) => {
        if (!docSnap.exists()) return;
        const data = docSnap.data();
        myFriendsList = data.friends || [];
        
        friendsListDiv.innerHTML = "";
        if (myFriendsList.length === 0) {
          friendsListDiv.innerHTML = `<div style="text-align: center; color: var(--text-muted); padding: 40px 20px; font-size: 13px;">No friends added yet.<br>Tap (+) to find & add friends!</div>`;
          return;
        }

        myFriendsList.forEach(friendName => {
          const item = document.createElement('div');
          item.className = 'list-item';
          item.innerHTML = `
            <div class="list-item-left">
              <div class="avatar-icon" style="width: 38px; height: 38px; font-size: 15px;">${friendName.charAt(0).toUpperCase()}</div>
              <div style="min-width: 0;">
                <strong style="font-size: 14px; display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">${friendName}</strong>
                <div style="font-size: 11px; color: var(--accent);">Friend</div>
              </div>
            </div>
            <button class="btn-action btn-unfriend">Unfriend</button>
          `;

          item.querySelector('.list-item-left').addEventListener('click', () => {
            if (typeof openChatWith === 'function') openChatWith(friendName);
          });

          const unfriendBtn = item.querySelector('.btn-unfriend');
          unfriendBtn.addEventListener('click', async (e) => {
            e.stopPropagation();
            if (confirm(`Are you sure you want to unfriend ${friendName}?`)) {
              await removeFriend(friendName);
            }
          });

          friendsListDiv.appendChild(item);
        });
      });
    }

    async function removeFriend(friendName) {
      try {
        await updateDoc(doc(db, "users", myName), {
          friends: arrayRemove(friendName)
        });
        await updateDoc(doc(db, "users", friendName), {
          friends: arrayRemove(myName)
        });
        showToast(`You have unfriended ${friendName}.`);
      } catch (err) {
        console.error("Error unfriending:", err);
      }
    }

    // Tab Navigation Logic
    const tabChats = document.getElementById('tab-chats');
    const tabRequests = document.getElementById('tab-requests');
    const tabFriends = document.getElementById('tab-friends');

    function switchTab(activeTab) {
      tabChats.classList.remove('active');
      tabRequests.classList.remove('active');
      tabFriends.classList.remove('active');

      chatsListDiv.style.display = 'none';
      requestsListDiv.style.display = 'none';
      friendsListDiv.style.display = 'none';
      searchResultsDiv.style.display = 'none';
      searchBoxContainer.style.display = 'none';

      if (activeTab === 'chats') {
        tabChats.classList.add('active');
        chatsListDiv.style.display = 'block';
      } else if (activeTab === 'requests') {
        tabRequests.classList.add('active');
        requestsListDiv.style.display = 'block';
      } else if (activeTab === 'friends') {
        tabFriends.classList.add('active');
        friendsListDiv.style.display = 'block';
      } else if (activeTab === 'find') {
        searchBoxContainer.style.display = 'block';
        searchResultsDiv.style.display = 'block';
      }
    }

    tabChats.addEventListener('click', () => switchTab('chats'));
    tabRequests.addEventListener('click', () => switchTab('requests'));
    tabFriends.addEventListener('click', () => switchTab('friends'));

    // FAB (+) click opens FIND / Search view
    fabFind.addEventListener('click', () => {
      switchTab('find');
      loadFindUsers();
      searchUsersInput.focus();
    });

    // Placeholders for remaining chat & call listeners
    function startPingMeasurement() {}
    function listenMyUserData() {}
    function listenAllUsersStatus() {}
    function listenIncomingCalls() {}
  </script>
</body>
</html>
