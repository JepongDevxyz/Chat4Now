<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chat4Now - Messenger Call & WebRTC</title>
  <script src="https://js.pusher.com/7.2/pusher.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
    body { display: flex; height: 100vh; background: #f0f2f5; }
    
    #sidebar { width: 320px; background: #fff; border-right: 1px solid #e5e5e5; padding: 15px; display: flex; flex-direction: column; gap: 10px; }
    #chat-area { flex: 1; display: flex; flex-direction: column; position: relative; }
    
    .user-card { padding: 12px; background: #f8f9fa; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; margin-bottom: 5px; border: 1px solid #eee; }
    .user-card:hover { background: #e9ecef; }
    .status-dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; margin-right: 6px; }
    .online { background: #31a24c; }
    .offline { background: #b0b3b8; }
    .status-subtext { font-size: 0.75rem; color: #65676b; }
    
    .chat-logs { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
    .log-message { text-align: center; color: #65676b; font-size: 0.85rem; font-style: italic; background: #e4e6eb; padding: 6px 12px; border-radius: 12px; align-self: center; margin: 4px 0; }

    #user-modal { display: none; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: #fff; padding: 20px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.2); z-index: 500; min-width: 250px; text-align: center; }
    .modal-btns { margin-top: 15px; display: flex; gap: 8px; justify-content: center; }

    #call-screen {
      position: absolute; top: 0; left: 0; right: 0; bottom: 0;
      background: #18191a; display: none;
      flex-direction: column; align-items: center; justify-content: space-between;
      padding: 30px; z-index: 1000;
    }
    #video-grid { display: flex; width: 100%; height: 80%; position: relative; justify-content: center; align-items: center; }
    video { background: #000; border-radius: 12px; object-fit: cover; }
    #remote-video { width: 100%; height: 100%; }
    #local-video { width: 140px; height: 180px; position: absolute; bottom: 15px; right: 15px; border: 2px solid #fff; z-index: 1001; }
    
    .call-controls { display: flex; gap: 15px; z-index: 1002; }
    .btn { padding: 10px 20px; border: none; border-radius: 20px; font-weight: bold; cursor: pointer; }
    .btn-danger { background: #fa3e3e; color: white; }
    .btn-success { background: #0084ff; color: white; }
    .btn-secondary { background: #e4e6eb; color: #050505; }
  </style>
</head>
<body>

  <div id="sidebar">
    <h3>Users</h3>
    <div id="user-list"></div>
  </div>

  <div id="chat-area">
    <div class="chat-logs" id="chat-logs"></div>

    <div id="user-modal">
      <h4 id="modal-username">User Options</h4>
      <div class="modal-btns">
        <button class="btn btn-success" id="modal-msg-btn">Message</button>
        <button class="btn btn-secondary" id="modal-friend-btn">Add Friend</button>
        <button class="btn btn-danger" onclick="closeModal()">Close</button>
      </div>
    </div>

    <div id="call-screen">
      <h2 id="call-status-text" style="color: white;">Calling...</h2>
      <div id="video-grid">
        <video id="remote-video" autoplay playsinline></video>
        <video id="local-video" autoplay playsinline muted></video>
      </div>
      <div class="call-controls">
        <button class="btn btn-danger" id="end-call-btn">End Call</button>
      </div>
    </div>
  </div>

  <audio id="audio-ringtone" loop src="https://assets.mixkit.co/active_storage/sfx/1360/1360-preview.mp3"></audio>
  <audio id="audio-ringback" loop src="https://assets.mixkit.co/active_storage/sfx/1359/1359-preview.mp3"></audio>
  <audio id="audio-offline" src="https://assets.mixkit.co/active_storage/sfx/2573/2573-preview.mp3"></audio>

  <script>
    const currentUser = "Jepong_" + Math.floor(Math.random() * 1000);
    const isGuest = true;

    let pusher, globalChannel, userChannel;
    let peerConnection;
    let localStream;
    let activeCallTarget = null;
    let friendsSet = new Set();
    let usersData = {};

    const ringtone = document.getElementById("audio-ringtone");
    const ringback = document.getElementById("audio-ringback");
    const offlineSound = document.getElementById("audio-offline");

    function stopAllAudio() {
      ringtone.pause(); ringtone.currentTime = 0;
      ringback.pause(); ringback.currentTime = 0;
      offlineSound.pause(); offlineSound.currentTime = 0;
    }

    async function sendApiRequest(data) {
      return fetch('/api/message', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(data)
      });
    }

    async function initApp() {
      try {
        const res = await fetch('/api/message?action=config');
        const config = await res.json();

        pusher = new Pusher(config.key, {
          cluster: config.cluster,
          authEndpoint: '/api/message?action=auth',
          auth: { params: { username: currentUser } }
        });

        // Presence channel - Automatic online user tracking
        globalChannel = pusher.subscribe("presence-chat");

        globalChannel.bind("pusher:subscription_succeeded", (members) => {
          members.each((member) => {
            if (member.id !== currentUser) {
              usersData[member.id] = { status: 'online' };
            }
          });
          renderUserList();
        });

        globalChannel.bind("pusher:member_added", (member) => {
          usersData[member.id] = { status: 'online' };
          renderUserList();
        });

        globalChannel.bind("pusher:member_removed", (member) => {
          usersData[member.id] = { status: 'offline', lastSeen: Date.now() };
          renderUserList();
        });

        userChannel = pusher.subscribe(`private-user-${currentUser}`);
        setupPusherListeners();

      } catch (err) {
        console.error("Config load error:", err);
      }
    }

    function setupPusherListeners() {
      userChannel.bind("incoming-call", async (data) => {
        activeCallTarget = data.fromUserId;
        ringtone.play();

        if (confirm(`Incoming call from ${data.fromUserId}. Accept?`)) {
          stopAllAudio();
          await startWebRTC(data.fromUserId, data.isVideo);
          await peerConnection.setRemoteDescription(new RTCSessionDescription(data.offer));

          const answer = await peerConnection.createAnswer();
          await peerConnection.setLocalDescription(answer);

          document.getElementById("call-screen").style.display = "flex";
          sendApiRequest({ action: 'answer-call', toUserId: data.fromUserId, answer });
        } else {
          stopAllAudio();
          sendApiRequest({ action: 'end-call', toUserId: data.fromUserId, fromUserId: currentUser, logType: 'missed' });
        }
      });

      userChannel.bind("call-answered", async (data) => {
        stopAllAudio();
        document.getElementById("call-status-text").innerText = "Connected";
        await peerConnection.setRemoteDescription(new RTCSessionDescription(data.answer));
      });

      userChannel.bind("ice-candidate", async (data) => {
        if (peerConnection) {
          await peerConnection.addIceCandidate(new RTCIceCandidate(data.candidate));
        }
      });

      userChannel.bind("call-ended", (data) => {
        const msg = data.logType === 'missed' ? `You missed a call from ${data.fromUserId}` : `Call ended with ${data.fromUserId}`;
        terminateCallLocally(msg);
      });
    }

    function getFormattedLastSeen(timestamp) {
      if (!timestamp) return "Offline";
      const seconds = Math.floor((Date.now() - timestamp) / 1000);
      if (seconds < 60) return "Offline just now";
      const mins = Math.floor(seconds / 60);
      if (mins < 60) return `Offline ${mins}m ago`;
      const hours = Math.floor(mins / 60);
      return `Offline ${hours}h ago`;
    }

    const rtcConfig = { iceServers: [{ urls: "stun:stun.l.google.com:19302" }] };

    async function startWebRTC(targetUserId, isVideo = true) {
      activeCallTarget = targetUserId;
      peerConnection = new RTCPeerConnection(rtcConfig);

      localStream = await navigator.mediaDevices.getUserMedia({ video: isVideo, audio: true });
      document.getElementById("local-video").srcObject = localStream;
      localStream.getTracks().forEach(track => peerConnection.addTrack(track, localStream));

      peerConnection.ontrack = (event) => {
        document.getElementById("remote-video").srcObject = event.streams[0];
      };

      peerConnection.onicecandidate = (event) => {
        if (event.candidate) {
          sendApiRequest({ action: 'ice-candidate', toUserId: targetUserId, candidate: event.candidate });
        }
      };
    }

    async function startCall(targetUserId, isVideo = true) {
      const target = usersData[targetUserId];
      
      if (!target || target.status === 'offline') {
        offlineSound.play();
        appendLogMessage(`Cannot call ${targetUserId}. User is offline.`);
        return;
      }

      ringback.play();
      await startWebRTC(targetUserId, isVideo);
      document.getElementById("call-screen").style.display = "flex";

      const offer = await peerConnection.createOffer();
      await peerConnection.setLocalDescription(offer);
      
      sendApiRequest({ action: 'call-user', toUserId: targetUserId, fromUserId: currentUser, offer, isVideo });
    }

    document.getElementById("end-call-btn").addEventListener("click", () => {
      sendApiRequest({ action: 'end-call', toUserId: activeCallTarget, fromUserId: currentUser, logType: 'ended' });
      terminateCallLocally(`Call ended with ${activeCallTarget}`);
    });

    function terminateCallLocally(logText = null) {
      stopAllAudio();
      if (peerConnection) { peerConnection.close(); peerConnection = null; }
      if (localStream) { localStream.getTracks().forEach(track => track.stop()); }
      document.getElementById("call-screen").style.display = "none";
      if (logText) appendLogMessage(logText);
      activeCallTarget = null;
    }

    function appendLogMessage(text) {
      const logs = document.getElementById("chat-logs");
      const div = document.createElement("div");
      div.className = "log-message";
      div.innerText = text;
      logs.appendChild(div);
    }

    function openUserModal(targetUserId) {
      const modal = document.getElementById("user-modal");
      document.getElementById("modal-username").innerText = targetUserId;
      const friendBtn = document.getElementById("modal-friend-btn");

      if (friendsSet.has(targetUserId)) {
        friendBtn.innerText = "Unfriend";
        friendBtn.onclick = () => {
          friendsSet.delete(targetUserId);
          sendApiRequest({ action: 'unfriend', toUserId: targetUserId, fromUserId: currentUser });
          closeModal();
          renderUserList();
        };
      } else {
        friendBtn.innerText = "Add Friend";
        friendBtn.onclick = () => {
          if (isGuest) {
            alert("Guest accounts cannot send friend requests.");
            return;
          }
          sendApiRequest({ action: 'friend-request', toUserId: targetUserId, fromUserId: currentUser, isGuest });
          closeModal();
        };
      }

      document.getElementById("modal-msg-btn").onclick = () => {
        closeModal();
        appendLogMessage(`Conversation with ${targetUserId}`);
      };

      modal.style.display = "block";
    }

    function closeModal() {
      document.getElementById("user-modal").style.display = "none";
    }

    function renderUserList() {
      const list = document.getElementById("user-list");
      list.innerHTML = "";
      
      Object.keys(usersData).forEach(uId => {
        if (uId === currentUser) return;
        const u = usersData[uId];
        const card = document.createElement("div");
        card.className = "user-card";
        card.onclick = () => openUserModal(uId);

        const statusText = u.status === 'online' ? 'Online' : getFormattedLastSeen(u.lastSeen);
        card.innerHTML = `
          <div>
            <strong>${uId}</strong> ${friendsSet.has(uId) ? '🤝' : ''}
            <div class="status-subtext">${statusText}</div>
          </div>
          <div>
            <span class="status-dot ${u.status === 'online' ? 'online' : 'offline'}"></span>
            <button class="btn btn-secondary" onclick="event.stopPropagation(); startCall('${uId}', true)">📞</button>
          </div>
        `;
        list.appendChild(card);
      });
    }

    // Start App
    initApp();
  </script>
</body>
</html>
