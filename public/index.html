<!DOCTYPE html>
<html lang="tl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chat4Now - Modern Messenger</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="bg-slate-900 text-slate-100 h-screen flex justify-center items-center p-2 sm:p-4">

  <!-- LOGIN SCREEN -->
  <div id="login-screen" class="bg-slate-800 p-8 rounded-2xl shadow-2xl w-full max-w-md text-center border border-slate-700">
    <div class="w-16 h-16 bg-blue-600 rounded-full flex items-center justify-center mx-auto mb-4 text-2xl shadow-lg">
      <i class="fa-solid fa-comments text-white"></i>
    </div>
    <h1 class="text-2xl font-bold mb-2">Chat4Now</h1>
    <p class="text-slate-400 text-sm mb-6">Mag-sign in gamit ang Google para makipag-chat sa mga kaibigan.</p>
    <button id="btn-login" class="w-full bg-white text-slate-800 font-semibold py-3 px-4 rounded-xl flex items-center justify-center gap-3 hover:bg-slate-100 transition shadow-md">
      <img src="https://www.svgrepo.com/show/475656/google-color.svg" class="w-5 h-5" alt="Google">
      Continue with Google
    </button>
  </div>

  <!-- MAIN CHAT INTERFACE -->
  <div id="chat-app" class="hidden bg-slate-800 w-full max-w-5xl h-[90vh] rounded-2xl shadow-2xl overflow-hidden border border-slate-700 flex flex-col md:flex-row">
    
    <!-- SIDEBAR -->
    <div class="w-full md:w-80 bg-slate-800/50 border-r border-slate-700 flex flex-col">
      <div class="p-4 border-b border-slate-700 flex items-center justify-between">
        <div class="flex items-center gap-3">
          <div class="relative">
            <img id="user-avatar" class="w-10 h-10 rounded-full object-cover" src="https://i.pravatar.cc/100" alt="Avatar">
            <span class="w-3 h-3 bg-emerald-500 border-2 border-slate-800 rounded-full absolute bottom-0 right-0"></span>
          </div>
          <span id="user-name" class="font-semibold text-sm truncate">User Name</span>
        </div>
        <button id="btn-logout" class="text-slate-400 hover:text-red-400 text-sm p-2"><i class="fa-solid fa-right-from-bracket"></i></button>
      </div>

      <div class="p-3 border-b border-slate-700">
        <div class="relative">
          <input type="text" id="search-friend" placeholder="Mag-hanap ng user..." class="w-full bg-slate-900 text-sm rounded-xl pl-9 pr-4 py-2 border border-slate-700 focus:outline-none focus:border-blue-500 text-white">
          <i class="fa-solid fa-magnifying-glass absolute left-3 top-2.5 text-slate-500 text-sm"></i>
        </div>
      </div>

      <div class="flex-1 overflow-y-auto p-2 space-y-1" id="friends-list">
        <p class="text-slate-500 text-xs text-center mt-4">Wala pang nakikitang user...</p>
      </div>
    </div>

    <!-- MAIN CHAT AREA -->
    <div class="flex-1 flex flex-col bg-slate-900/40">
      <div class="p-4 border-b border-slate-700 flex items-center justify-between bg-slate-800/30">
        <div class="flex items-center gap-3">
          <div class="relative">
            <img id="active-chat-avatar" class="w-10 h-10 rounded-full" src="https://i.pravatar.cc/100" alt="">
            <span id="active-chat-status-dot" class="w-3 h-3 bg-slate-500 border-2 border-slate-800 rounded-full absolute bottom-0 right-0"></span>
          </div>
          <div>
            <h3 id="active-chat-name" class="font-semibold text-sm">Pumili ng kaibigan</h3>
            <span id="active-chat-status-text" class="text-xs text-slate-400">Offline</span>
          </div>
        </div>
      </div>

      <div class="flex-1 overflow-y-auto p-4 space-y-3" id="messages-box">
        <p class="text-center text-slate-500 text-sm mt-10">Pumili ng chat para magsimula ng usapan.</p>
      </div>

      <form id="chat-form" class="p-3 bg-slate-800 border-t border-slate-700 flex gap-2">
        <input type="text" id="msg-input" placeholder="I-type ang iyong mensahe..." class="flex-1 bg-slate-900 border border-slate-700 rounded-xl px-4 py-2 text-sm focus:outline-none focus:border-blue-500 text-white" disabled>
        <button type="submit" id="btn-send" class="bg-blue-600 hover:bg-blue-500 text-white px-4 py-2 rounded-xl text-sm transition disabled:opacity-50" disabled><i class="fa-solid fa-paper-plane"></i></button>
      </form>
    </div>

  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getFirestore, doc, setDoc, collection, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyC3mJ-9-hv85jZiAsGi_kuuZjj_mmjAUmQ",
      authDomain: "chat4now-orforever.firebaseapp.com",
      projectId: "chat4now-orforever",
      storageBucket: "chat4now-orforever.firebasestorage.app",
      messagingSenderId: "1027816238177",
      appId: "1:1027816238177:web:9b3794c53f4d194cbc4e20",
      measurementId: "G-KCH61T1TYP"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const provider = new GoogleAuthProvider();

    let currentUser = null;

    document.getElementById('btn-login').addEventListener('click', () => {
      signInWithPopup(auth, provider).catch(error => alert("Login failed: " + error.message));
    });

    document.getElementById('btn-logout').addEventListener('click', () => {
      if(currentUser) {
        setDoc(doc(db, "users", currentUser.uid), { isOnline: false }, { merge: true });
      }
      signOut(auth);
    });

    onAuthStateChanged(auth, async (user) => {
      if (user) {
        currentUser = user;
        document.getElementById('login-screen').classList.add('hidden');
        document.getElementById('chat-app').classList.remove('hidden');

        document.getElementById('user-name').innerText = user.displayName;
        document.getElementById('user-avatar').src = user.photoURL;

        await setDoc(doc(db, "users", user.uid), {
          uid: user.uid,
          name: user.displayName,
          email: user.email,
          photoURL: user.photoURL,
          isOnline: true
        }, { merge: true });

        loadUsers();
      } else {
        document.getElementById('chat-app').classList.add('hidden');
        document.getElementById('login-screen').classList.remove('hidden');
      }
    });

    function loadUsers() {
      onSnapshot(collection(db, "users"), (snapshot) => {
        const list = document.getElementById('friends-list');
        list.innerHTML = "";

        snapshot.forEach((docSnap) => {
          const userData = docSnap.data();
          if(userData.uid !== currentUser.uid) {
            const isOnline = userData.isOnline;
            
            const userCard = document.createElement('div');
            userCard.className = "flex items-center gap-3 p-3 rounded-xl bg-slate-700/30 hover:bg-slate-700 cursor-pointer transition";
            userCard.innerHTML = `
              <div class="relative">
                <img class="w-10 h-10 rounded-full object-cover" src="${userData.photoURL}" alt="">
                <span class="w-3 h-3 ${isOnline ? 'bg-emerald-500' : 'bg-slate-500'} border-2 border-slate-800 rounded-full absolute bottom-0 right-0"></span>
              </div>
              <div class="flex-1 min-w-0">
                <h4 class="text-sm font-semibold truncate">${userData.name}</h4>
                <p class="text-xs ${isOnline ? 'text-emerald-400' : 'text-slate-400'}">${isOnline ? 'Online' : 'Offline'}</p>
              </div>
            `;
            list.appendChild(userCard);
          }
        });
      });
    }
  </script>
</body>
</html>
