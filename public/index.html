<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Chat4Now Messenger</title>
  <!-- Jitsi Meet External API -->
  <script src="https://meet.jit.si/external_api.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    
    html, body { 
      height: 100dvh; 
      width: 100vw; 
      overflow: hidden; 
      background-color: #0b141a; 
      color: #e9edef; 
    }

    body { display: flex; justify-content: center; align-items: center; }

    .app-container { 
      width: 100vw; 
      height: 100dvh; 
      max-width: 1200px; 
      max-height: 100dvh; 
      display: flex; 
      background: #111b21; 
      position: relative; 
      overflow: hidden; 
    }

    @media (min-width: 768px) { 
      .app-container { 
        height: 95dvh; 
        max-height: 900px; 
        border-radius: 12px; 
        box-shadow: 0 12px 32px rgba(0,0,0,0.5); 
      } 
    }

    /* Login Screen */
    .login-card { 
      background: #202c33; 
      padding: 30px; 
      border-radius: 16px; 
      width: 90%; 
      max-width: 400px; 
      text-align: center; 
      box-shadow: 0 10px 25px rgba(0,0,0,0.4); 
    }
    .login-card h1 { color: #00a884; font-size: 28px; margin-bottom: 8px; }
    .login-card p { color: #8696a0; font-size: 14px; margin-bottom: 20px; }
    .login-card input { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #2a3942; background: #111b21; color: #fff; margin-bottom: 16px; font-size: 15px; outline: none; }
    .btn-login { width: 100%; padding: 12px; border-radius: 8px; border: none; background: #00a884; color: #111b21; font-weight: bold; font-size: 16px; cursor: pointer; }

    #main-app { display: none; width: 100%; height: 100dvh; flex-direction: row; }

    .sidebar { 
      width: 100%; 
      max-width: 350px; 
      background: #111b21; 
      border-right: 1px solid #222d34; 
      display: flex; 
      flex-direction: column; 
      height: 100%; 
      z-index: 10;
    }

    @media (max-width: 768px) { 
      .sidebar { max-width: 100%; } 
      .chat-area { display: none; } 
      .chat-area.active { display: flex !important; position: absolute; top: 0; left: 0; width: 100vw; height: 100dvh; z-index: 30; } 
    }

    .sidebar-header { background: #202c33; padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #222d34; flex-shrink: 0; }
    .user-info { display: flex; align-items: center; gap: 10px; }
    .avatar-icon { width: 38px; height: 38px; border-radius: 50%; background: #00a884; color: #111b21; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 18px; }
    .ping-badge { font-size: 11px; background: #222d34; padding: 4px 8px; border-radius: 12px; color: #25d366; border: 1px solid #2a3942; }

    .tab-bar { display: flex; background: #111b21; border-bottom: 1px solid #222d34; flex-shrink: 0; }
    .tab-btn { flex: 1; padding: 12px 0; background: none; border: none; color: #8696a0; font-weight: bold; font-size: 13px; cursor: pointer; border-bottom: 2px solid transparent; }
    .tab-btn.active { color: #00a884; border-bottom: 2px solid #00a884; }

    .list-container { flex: 1; overflow-y: auto; padding: 8px; position: relative; }
    .search-box { padding: 8px; background: #111b21; flex-shrink: 0; }
    .search-box input { width: 100%; padding: 10px; border-radius: 8px; border: none; background: #202c33; color: #e9edef; font-size: 14px; outline: none; }

    .list-item { display: flex; align-items: center; justify-content: space-between; padding: 12px; border-radius: 8px; margin-bottom: 4px; background: #111b21; cursor: pointer; }
    .list-item:hover { background: #202c33; }
    .list-item-left { display: flex; align-items: center; gap: 12px; }
    .status-dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
    .online { background: #25d366; box-shadow: 0 0 6px #25d366; }
    .offline { background: #8696a0; }

    .btn-action { padding: 8px 14px; border-radius: 6px; border: none; font-size: 13px; font-weight: bold; cursor: pointer; touch-action: manipulation; }
    .btn-add { background: #00a884; color: #111b21; }
    .btn-accept { background: #25d366; color: #111b21; }

    .chat-area { flex: 1; display: flex; flex-direction: column; background: #0b141a; height: 100%; width: 100%; position: relative; overflow: hidden; }

    .chat-header { background: #202c33; padding: 12px 16px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #222d34; flex-shrink: 0; height: 60px; }

    .back-btn { display: none; background: none; border: none; color: #00a884; font-size: 20px; cursor: pointer; margin-right: 10px; }
    @media (max-width: 768px) { .back-btn { display: block; } }

    .messages-box { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px; background-image: radial-gradient(#1f2c34 1px, transparent 1px); background-size: 20px 20px; }

    .message-bubble { max-width: 80%; padding: 8px 12px; border-radius: 8px; font-size: 14px; line-height: 1.4; word-wrap: break-word; }
    .msg-incoming { background: #202c33; align-self: flex-start; color: #e9edef; }
    .msg-outgoing { background: #005c4b; align-self: flex-end; color: #e9edef; }
    .msg-sender { font-size: 11px; font-weight: bold; color: #25d366; margin-bottom: 2px; }
    .media-preview { max-width: 100%; max-height: 220px; border-radius: 6px; margin-top: 6px; display: block; }
    .audio-player { margin-top: 6px; width: 220px; outline: none; }

    .chat-footer { background: #202c33; padding: 10px 12px; display: flex; flex-direction: column; gap: 6px; border-top: 1px solid #222d34; flex-shrink: 0; width: 100%; }

    .controls-bar { display: flex; justify-content: space-between; align-items: center; font-size: 12px; color: #8696a0; }
    .input-row { display: flex; align-items: center; gap: 8px; width: 100%; }
    .input-row input[type="text"] { flex: 1; padding: 12px; border-radius: 8px; border: none; background: #2a3942; color: #fff; font-size: 14px; outline: none; }
    .btn-send { padding: 12px 16px; border-radius: 8px; border: none; background: #00a884; color: #111b21; font-weight: bold; cursor: pointer; flex-shrink: 0; }
    .icon-btn { background: none; border: none; color: #8696a0; font-size: 20px; cursor: pointer; flex-shrink: 0; }
    .icon-btn.recording { color: #e53935; animation: pulse 1s infinite; }

    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.2); }
      100% { transform: scale(1); }
    }

    #call-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: #111b21; z-index: 100; display: none; flex-direction: column; }
    #jitsi-container { width: 100%; height: calc(100% - 50px); }
  </style>
</head>
<body>

  <!-- Login Card -->
  <div class="login-card" id="login-screen">
    <h1>Chat4Now</h1>
    <p>Messenger & Telegram-inspired Chat</p>
    <input type="text" id="username-input" placeholder="Enter your display name..." />
    <button class="btn-login" id="enter-btn">Start Messaging</button>
  </div>

  <!-- Main Messenger Layout -->
  <div class="app-container" id="main-app">
    
    <!-- Sidebar -->
    <div class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <div class="user-info">
          <div class="avatar-icon" id="user-avatar">U</div>
          <div>
            <strong id="my-name-display">User</strong>
            <div style="font-size: 11px; color: #25d366;">● Online</div>
          </div>
        </div>
        <div class="ping-badge" id="ping-display">Ping: -- ms</div>
      </div>

      <div class="tab-bar">
        <button class="tab-btn active" id="tab-chats">CHATS</button>
        <button class="tab-btn" id="tab-requests">REQUESTS <span id="req-count"></span></button>
        <button class="tab-btn" id="tab-search">FIND</button>
      </div>

      <div class="search-box" id="search-box-container" style="display: none;">
        <input type="text" id="search-users-input" placeholder="🔍 Search users by name..." />
      </div>

      <div class="list-container">
        <div id="chats-list"></div>
        <div id="requests-list" style="display: none;"></div>
        <div id="search-results-list" style="display: none;"></div>
      </div>
    </div>

    <!-- Main Chat Window -->
    <div class="chat-area" id="chat-area">
      <div id="no-chat-selected" style="flex: 1; display: flex; justify-content: center; align-items: center; color: #8696a0; flex-direction: column; gap: 10px;">
        <div style="font-size: 40px;">💬</div>
        <div>Select a friend from the left sidebar to start chatting</div>
      </div>

      <div id="active-chat-window" style="display: none; flex-direction: column; height: 100%; width: 100%;">
        <div class="chat-header">
          <div style="display: flex; align-items: center;">
            <button class="back-btn" id="back-to-list">←</button>
            <div>
              <strong id="active-friend-name">Friend Name</strong>
              <div style="font-size: 11px; color: #8696a0;" id="active-friend-status">Offline</div>
            </div>
          </div>
          <div style="display: flex; gap: 12px;">
            <button class="icon-btn" id="start-voice-call-btn" title="Start Voice Call">📞</button>
            <button class="icon-btn" id="start-video-call-btn" title="Start Video Call">📹</button>
          </div>
        </div>

        <div class="messages-box" id="messages-box"></div>

        <div class="chat-footer">
          <div class="controls-bar">
            <label style="display: flex; align-items: center; gap: 6px; cursor: pointer;">
              <input type="checkbox" id="hd-toggle" />
              <span><b>HD File Mode</b> (Up to 1GB Storage)</span>
            </label>
            <span id="selected-file-name" style="color: #00a884; font-size: 11px; max-width: 150px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;"></span>
          </div>

          <div class="input-row">
            <label class="icon-btn" for="file-upload-input" title="Attach File">📎</label>
            <input type="file" id="file-upload-input" style="display: none;" accept="image/*,video/*,.pdf,.zip,.doc" />
            
            <button class="icon-btn" id="record-audio-btn" title="Hold or Click to Record Voice Note">🎙️</button>
            
            <input type="text" id="message-text-input" placeholder="Type a message..." />
            <button class="btn-send" id="send-msg-btn">Send</button>
          </div>
        </div>
      </div>

      <!-- Native Jitsi Call Overlay -->
      <div id="call-overlay">
        <div style="padding: 10px 16px; background: #202c33; display: flex; justify-content: space-between; align-items: center; height: 50px;">
          <span id="call-type-title">Call</span>
          <button class="btn-action" style="background: #e53935; color: #fff;" id="end-call-btn">End Call</button>
        </div>
        <div id="jitsi-container"></div>
      </div>

    </div>

  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, addDoc, query, orderBy, onSnapshot, serverTimestamp, setDoc, doc, where, getDocs, arrayUnion } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
    import { getStorage, ref, uploadBytesResumable, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-storage.js";

    const firebaseConfig = {
      apiKey: "AIzaSyC3mJ-9-hv85jZiAsGi_kuuZjj_mmjAUmQ",
      authDomain: "chat4now-orforever.firebaseapp.com",
      projectId: "chat4now-orforever",
      storageBucket: "chat4now-orforever.firebasestorage.app",
      messagingSenderId: "1027816238177",
      appId: "1:1027816238177:web:9b3794c53f4d194cbc4e20"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const storage = getStorage(app);

    let myName = "";
    let activeFriend = null;
    let selectedFile = null;
    let myFriendsList = [];
    let myRequestsList = [];
    let jitsiApi = null;

    let mediaRecorder = null;
    let audioChunks = [];
    let isRecording = false;

    const loginScreen = document.getElementById('login-screen');
    const mainApp = document.getElementById('main-app');
    const usernameInput = document.getElementById('username-input');
    const enterBtn = document.getElementById('enter-btn');
    
    const chatsListDiv = document.getElementById('chats-list');
    const requestsListDiv = document.getElementById('requests-list');
    const searchResultsDiv = document.getElementById('search-results-list');
    
    const activeFriendName = document.getElementById('active-friend-name');
    const activeFriendStatus = document.getElementById('active-friend-status');
    const messagesBox = document.getElementById('messages-box');
    const messageTextInput = document.getElementById('message-text-input');
    const fileUploadInput = document.getElementById('file-upload-input');
    const selectedFileName = document.getElementById('selected-file-name');
    const recordAudioBtn = document.getElementById('record-audio-btn');

    enterBtn.addEventListener('click', async () => {
      const name = usernameInput.value.trim();
      if (!name) return alert("Please enter your name!");
      myName = name;

      document.getElementById('my-name-display').textContent = myName;
      document.getElementById('user-avatar').textContent = myName.charAt(0).toUpperCase();

      await setUserOnline();

      loginScreen.style.display = "none";
      mainApp.style.display = "flex";

      startPingMeasurement();
      listenMyUserData();
      listenAllUsersStatus();
      keepOnlineHeartbeat();
    });

    async function setUserOnline() {
      if (!myName) return;
      await setDoc(doc(db, "users", myName), { name: myName, status: "online", lastSeen: Date.now() }, { merge: true });
    }

    function keepOnlineHeartbeat() {
      setInterval(async () => {
        if (myName) {
          await setDoc(doc(db, "users", myName), { status: "online", lastSeen: Date.now() }, { merge: true });
        }
      }, 10000);
    }

    function startPingMeasurement() {
      setInterval(async () => {
        const start = Date.now();
        try {
          await getDocs(query(collection(db, "users"), where("name", "==", myName)));
          const ping = Date.now() - start;
          const pingDisplay = document.getElementById('ping-display');
          pingDisplay.textContent = `Ping: ${ping} ms`;
          pingDisplay.style.color = ping < 150 ? "#25d366" : ping < 300 ? "#ffb703" : "#e53935";
        } catch (e) {}
      }, 5000);
    }

    function listenMyUserData() {
      onSnapshot(doc(db, "users", myName), (snapshot) => {
        if (!snapshot.exists()) return;
        const data = snapshot.data();
        myFriendsList = data.friends || [];
        myRequestsList = data.requests || [];

        document.getElementById('req-count').textContent = myRequestsList.length ? `(${myRequestsList.length})` : '';
        renderFriendsList();
        renderRequestsList();
      });
    }

    window.userStatuses = {};
    function listenAllUsersStatus() {
      onSnapshot(collection(db, "users"), (snapshot) => {
        const now = Date.now();
        snapshot.forEach(d => {
          const u = d.data();
          const isRecentlyActive = u.lastSeen && (now - u.lastSeen < 35000);
          window.userStatuses[d.id] = (u.status === "online" && isRecentlyActive) ? "online" : "offline";
        });
        renderFriendsList();
        if (activeFriend) {
          const st = window.userStatuses[activeFriend] || "offline";
          activeFriendStatus.textContent = st;
          activeFriendStatus.style.color = st === "online" ? "#25d366" : "#8696a0";
        }
      });
    }

    document.getElementById('tab-chats').addEventListener('click', (e) => switchTab('chats', e.target));
    document.getElementById('tab-requests').addEventListener('click', (e) => switchTab('requests', e.target));
    document.getElementById('tab-search').addEventListener('click', (e) => switchTab('search', e.target));

    function switchTab(tab, btn) {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');

      chatsListDiv.style.display = tab === 'chats' ? 'block' : 'none';
      requestsListDiv.style.display = tab === 'requests' ? 'block' : 'none';
      searchResultsDiv.style.display = tab === 'search' ? 'block' : 'none';
      document.getElementById('search-box-container').style.display = tab === 'search' ? 'block' : 'none';
    }

    document.getElementById('search-users-input').addEventListener('input', async (e) => {
      const term = e.target.value.trim().toLowerCase();
      searchResultsDiv.innerHTML = "";
      if (!term) return;

      const qSnap = await getDocs(collection(db, "users"));
      qSnap.forEach(uDoc => {
        const u = uDoc.data();
        if (u.name && u.name !== myName && u.name.toLowerCase().includes(term)) {
          const isFriend = myFriendsList.includes(u.name);
          const div = document.createElement('div');
          div.className = 'list-item';
          
          const userText = document.createElement('div');
          userText.className = 'list-item-left';
          userText.innerHTML = `<strong>${u.name}</strong>`;
          div.appendChild(userText);

          if (isFriend) {
            const friendLabel = document.createElement('span');
            friendLabel.style.fontSize = '12px';
            friendLabel.style.color = '#25d366';
            friendLabel.textContent = 'Friends';
            div.appendChild(friendLabel);
          } else {
            const addBtn = document.createElement('button');
            addBtn.className = 'btn-action btn-add';
            addBtn.textContent = '+ Add Friend';
            addBtn.onclick = (evt) => {
              evt.stopPropagation();
              sendFriendRequest(u.name);
            };
            div.appendChild(addBtn);
          }

          searchResultsDiv.appendChild(div);
        }
      });
    });

    window.sendFriendRequest = async (targetName) => {
      try {
        await setDoc(doc(db, "users", targetName), { requests: arrayUnion(myName) }, { merge: true });
        alert(`Friend request sent to ${targetName}!`);
      } catch (err) {
        alert("Error sending request: " + err.message);
      }
    };

    function renderRequestsList() {
      requestsListDiv.innerHTML = "";
      if (myRequestsList.length === 0) {
        requestsListDiv.innerHTML = `<div style="text-align:center; padding:20px; color:#8696a0;">No pending requests</div>`;
        return;
      }
      myRequestsList.forEach(reqUser => {
        const div = document.createElement('div');
        div.className = 'list-item';
        
        const label = document.createElement('strong');
        label.textContent = reqUser;
        div.appendChild(label);

        const acceptBtn = document.createElement('button');
        acceptBtn.className = 'btn-action btn-accept';
        acceptBtn.textContent = 'Accept';
        acceptBtn.onclick = () => acceptFriendRequest(reqUser);
        div.appendChild(acceptBtn);

        requestsListDiv.appendChild(div);
      });
    }

    window.acceptFriendRequest = async (reqUser) => {
      await setDoc(doc(db, "users", myName), { friends: arrayUnion(reqUser), requests: myRequestsList.filter(r => r !== reqUser) }, { merge: true });
      await setDoc(doc(db, "users", reqUser), { friends: arrayUnion(myName) }, { merge: true });
      alert(`You are now friends with ${reqUser}!`);
    };

    function renderFriendsList() {
      chatsListDiv.innerHTML = "";
      if (myFriendsList.length === 0) {
        chatsListDiv.innerHTML = `<div style="text-align:center; padding:20px; color:#8696a0;">No friends yet. Find friends in the FIND tab!</div>`;
        return;
      }
      myFriendsList.forEach(fName => {
        const st = window.userStatuses[fName] || "offline";
        const div = document.createElement('div');
        div.className = 'list-item';
        div.onclick = () => openChatWindow(fName);
        div.innerHTML = `
          <div class="list-item-left">
            <span class="status-dot ${st}"></span>
            <strong>${fName}</strong>
          </div>
          <small style="color: #8696a0;">${st}</small>
        `;
        chatsListDiv.appendChild(div);
      });
    }

    let messagesUnsubscribe = null;
    function openChatWindow(friendName) {
      activeFriend = friendName;
      document.getElementById('no-chat-selected').style.display = 'none';
      document.getElementById('active-chat-window').style.display = 'flex';
      activeFriendName.textContent = activeFriend;

      const st = window.userStatuses[activeFriend] || "offline";
      activeFriendStatus.textContent = st;
      activeFriendStatus.style.color = st === "online" ? "#25d366" : "#8696a0";

      document.getElementById('chat-area').classList.add('active');

      const chatId = [myName, activeFriend].sort().join("_");

      if (messagesUnsubscribe) messagesUnsubscribe();

      const q = query(collection(db, "chats", chatId, "messages"), orderBy("createdAt", "asc"));
      messagesUnsubscribe = onSnapshot(q, (snapshot) => {
        messagesBox.innerHTML = "";
        snapshot.forEach(mDoc => {
          const msg = mDoc.data();
          const isMe = msg.sender === myName;
          const bubble = document.createElement('div');
          bubble.className = `message-bubble ${isMe ? 'msg-outgoing' : 'msg-incoming'}`;

          let mediaContent = "";
          if (msg.fileUrl) {
            if (msg.fileType && msg.fileType.startsWith('image/')) {
              mediaContent = `<img src="${msg.fileUrl}" class="media-preview" />`;
            } else if (msg.fileType && msg.fileType.startsWith('video/')) {
              mediaContent = `<video src="${msg.fileUrl}" controls class="media-preview"></video>`;
            } else if (msg.fileType && msg.fileType.startsWith('audio/')) {
              mediaContent = `<audio src="${msg.fileUrl}" controls class="audio-player"></audio>`;
            } else {
              mediaContent = `<a href="${msg.fileUrl}" target="_blank" style="color:#00a884; display:block; margin-top:4px;">📁 Download File (${msg.fileName || 'Attachment'})</a>`;
            }
          }

          bubble.innerHTML = `
            <div class="msg-sender">${msg.sender} ${msg.isHD ? '[HD]' : ''}</div>
            <div>${msg.text || ''}</div>
            ${mediaContent}
          `;
          messagesBox.appendChild(bubble);
        });
        messagesBox.scrollTop = messagesBox.scrollHeight;
      });
    }

    document.getElementById('back-to-list').addEventListener('click', () => {
      document.getElementById('chat-area').classList.remove('active');
    });

    fileUploadInput.addEventListener('change', (e) => {
      if (e.target.files && e.target.files[0]) {
        selectedFile = e.target.files[0];
        selectedFileName.textContent = selectedFile.name;
      } else {
        selectedFile = null;
        selectedFileName.textContent = "";
      }
    });

    document.getElementById('send-msg-btn').addEventListener('click', sendMessage);
    messageTextInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') sendMessage(); });

    async function sendMessage() {
      const text = messageTextInput.value.trim();
      const isHD = document.getElementById('hd-toggle').checked;
      
      if (!text && !selectedFile) return;

      const chatId = [myName, activeFriend].sort().join("_");
      let fileUrl = null;
      let fileType = null;
      let fileName = null;

      const currentFile = selectedFile;
      
      messageTextInput.value = "";
      fileUploadInput.value = "";
      selectedFile = null;
      
      if (currentFile) {
        selectedFileName.textContent = "Uploading file...";
        try {
          const fileRef = ref(storage, `chat_files/${Date.now()}_${currentFile.name}`);
          const uploadTask = await uploadBytesResumable(fileRef, currentFile);
          fileUrl = await getDownloadURL(uploadTask.ref);
          fileType = currentFile.type;
          fileName = currentFile.name;
        } catch (err) {
          console.error("Storage upload error:", err);
        }
        selectedFileName.textContent = "";
      }

      try {
        await addDoc(collection(db, "chats", chatId, "messages"), {
          sender: myName,
          text: text,
          fileUrl: fileUrl,
          fileType: fileType,
          fileName: fileName,
          isHD: isHD,
          createdAt: serverTimestamp()
        });
      } catch (e) {
        alert("Failed to send message: " + e.message);
      }
    }

    // Direct Base64 Voice Recorder
    recordAudioBtn.addEventListener('click', async () => {
      if (!isRecording) {
        try {
          const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
          mediaRecorder = new MediaRecorder(stream);
          audioChunks = [];

          mediaRecorder.ondataavailable = (e) => audioChunks.push(e.data);
          mediaRecorder.onstop = async () => {
            const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
            
            selectedFileName.textContent = "Sending voice...";
            const reader = new FileReader();
            reader.readAsDataURL(audioBlob);
            reader.onloadend = async () => {
              const base64Audio = reader.result;
              const chatId = [myName, activeFriend].sort().join("_");

              try {
                await addDoc(collection(db, "chats", chatId, "messages"), {
                  sender: myName,
                  text: "🎤 Voice Message",
                  fileUrl: base64Audio,
                  fileType: "audio/webm",
                  fileName: "VoiceNote.webm",
                  createdAt: serverTimestamp()
                });
              } catch (e) {
                alert("Failed to send voice: " + e.message);
              }
              selectedFileName.textContent = "";
            };
          };

          mediaRecorder.start();
          isRecording = true;
          recordAudioBtn.classList.add('recording');
          recordAudioBtn.title = "Click again to Stop & Send";
        } catch (err) {
          alert("Microphone access denied or not supported.");
        }
      } else {
        mediaRecorder.stop();
        isRecording = false;
        recordAudioBtn.classList.remove('recording');
        recordAudioBtn.title = "Hold or Click to Record Voice Note";
      }
    });

    // Function to close call overlay cleanly
    function closeCallScreen() {
      if (jitsiApi) {
        jitsiApi.dispose();
        jitsiApi = null;
      }
      document.getElementById('jitsi-container').innerHTML = "";
      document.getElementById('call-overlay').style.display = 'none';
    }

    // Native Jitsi Direct Calls
    function startCall(isAudioOnly) {
      document.getElementById('call-overlay').style.display = 'flex';
      document.getElementById('call-type-title').textContent = isAudioOnly ? "📞 Voice Call" : "📹 Video Call";
      
      const roomName = `Chat4Now_Direct_Call_${[myName, activeFriend].sort().join("_")}`;
      const domain = "meet.jit.si";
      
      const options = {
        roomName: roomName,
        width: '100%',
        height: '100%',
        parentNode: document.getElementById('jitsi-container'),
        userInfo: {
          displayName: myName
        },
        configOverwrite: {
          startWithVideoMuted: isAudioOnly,
          startWithAudioMuted: false,
          prejoinPageEnabled: false,
          disableDeepLinking: true,
          toolbarButtons: [
            'microphone', 'camera', 'closed-captions', 'desktop', 'fullscreen',
            'fodeviceselection', 'hangup', 'chat', 'settings', 'raise-hand',
            'videoquality', 'filmstrip', 'stats', 'shortcuts'
          ]
        },
        interfaceConfigOverwrite: {
          MOBILE_APP_PROMO: false,
          PROVIDER_NAME: 'Chat4Now',
          SHOW_JITSI_WATERMARK: false,
          SHOW_WATERMARK_FOR_GUESTS: false,
          HIDE_INVITE_MORE_HEADER: true
        }
      };

      if (jitsiApi) jitsiApi.dispose();
      jitsiApi = new JitsiMeetExternalAPI(domain, options);

      // Auto-close overlay kapag natapos o umalis na sa call
      jitsiApi.addListener('videoConferenceLeft', () => {
        closeCallScreen();
      });
    }

    document.getElementById('start-voice-call-btn').addEventListener('click', () => startCall(true));
    document.getElementById('start-video-call-btn').addEventListener('click', () => startCall(false));

    document.getElementById('end-call-btn').addEventListener('click', () => {
      if (jitsiApi) {
        jitsiApi.executeCommand('hangup');
      } else {
        closeCallScreen();
      }
    });
  </script>
</body>
</html>
