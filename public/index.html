<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chat4Now Messenger</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    body {
      background-color: #121212;
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    .container {
      background-color: #1e1e1e;
      padding: 30px;
      border-radius: 16px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
      width: 100%;
      max-width: 400px;
      text-align: center;
    }
    h1 {
      font-size: 24px;
      margin-bottom: 8px;
    }
    p {
      color: #aaa;
      font-size: 14px;
      margin-bottom: 20px;
    }
    input[type="text"] {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #333;
      background-color: #2a2a2a;
      color: white;
      font-size: 14px;
      margin-bottom: 16px;
      outline: none;
    }
    input[type="text"]:focus {
      border-color: #0d6efd;
    }
    .btn-enter {
      width: 100%;
      padding: 12px;
      background-color: #0d6efd;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s ease;
    }
    .btn-enter:hover {
      background-color: #0b5ed7;
    }
    /* Placeholder UI para sa Chat Screen */
    #chat-screen {
      display: none;
      text-align: left;
    }
    .chat-header {
      border-bottom: 1px solid #333;
      padding-bottom: 12px;
      margin-bottom: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .btn-leave {
      background-color: #dc3545;
      color: white;
      border: none;
      padding: 6px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 12px;
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- Login / Enter Screen -->
    <div id="login-screen">
      <h1>Chat4Now</h1>
      <p>Maglagay ng pangalan para makapasok sa chat UI prototype.</p>
      <input type="text" id="username-input" placeholder="Enter your name..." />
      <button id="enter-btn" class="btn-enter">Enter Chat Room</button>
    </div>

    <!-- Main Chat UI Area (Dito mo ididisenyo ang UI mo) -->
    <div id="chat-screen">
      <div class="chat-header">
        <div>
          <h2 id="display-name">User</h2>
          <small style="color: #28a745;">● Online</small>
        </div>
        <button id="leave-btn" class="btn-leave">Exit</button>
      </div>
      
      <!-- Simulan mo dito ang pagbuo ng Chat UI Elements -->
      <div style="height: 200px; background: #141414; border-radius: 8px; padding: 12px; margin-bottom: 12px; overflow-y: auto;">
        <p style="color: #666; text-align: center; font-size: 12px;">Chat UI Area (Ready for Development)</p>
      </div>
    </div>
  </div>

  <script>
    const loginScreen = document.getElementById('login-screen');
    const chatScreen = document.getElementById('chat-screen');
    const usernameInput = document.getElementById('username-input');
    const enterBtn = document.getElementById('enter-btn');
    const leaveBtn = document.getElementById('leave-btn');
    const displayName = document.getElementById('display-name');

    enterBtn.addEventListener('click', () => {
      const name = usernameInput.value.trim();
      if (name) {
        displayName.textContent = name;
        loginScreen.style.display = 'none';
        chatScreen.style.display = 'block';
      } else {
        alert('Mangyaring maglagay ng pangalan.');
      }
    });

    leaveBtn.addEventListener('click', () => {
      loginScreen.style.display = 'block';
      chatScreen.style.display = 'none';
      usernameInput.value = '';
    });
  </script>
</body>
</html>
